name: Build SS-Mastering

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python build.py

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf SS-Mastering-linux.tar.gz -C dist SS-Mastering

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: zip -r SS-Mastering-macos.zip dist/SS-Mastering.app

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\SS-Mastering -DestinationPath SS-Mastering-windows.zip
        shell: pwsh

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SS-Mastering-linux
          path: SS-Mastering-linux.tar.gz

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SS-Mastering-macos
          path: SS-Mastering-macos.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SS-Mastering-windows
          path: SS-Mastering-windows.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SS-Mastering ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/SS-Mastering-linux/SS-Mastering-linux.tar.gz
            artifacts/SS-Mastering-windows/SS-Mastering-windows.zip
            artifacts/SS-Mastering-macos/SS-Mastering-macos.zip
