name: Build SS-Mastering

on:
  push:
    tags:
      - 'v*'          # trigger on tags like v2.0.0, v2.1.0, etc.
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: SS-Mastering-linux
            archive_cmd: tar -czf SS-Mastering-linux.tar.gz -C dist SS-Mastering
            archive_file: SS-Mastering-linux.tar.gz

          - os: windows-latest
            artifact: SS-Mastering-windows
            archive_cmd: powershell Compress-Archive -Path dist\SS-Mastering -DestinationPath SS-Mastering-windows.zip
            archive_file: SS-Mastering-windows.zip

          - os: macos-latest
            artifact: SS-Mastering-macos
            archive_cmd: zip -r SS-Mastering-macos.zip dist/SS-Mastering.app
            archive_file: SS-Mastering-macos.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python build.py

      - name: Archive build output
        run: ${{ matrix.archive_cmd }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive_file }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          name: SS-Mastering ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/SS-Mastering-linux/SS-Mastering-linux.tar.gz
            artifacts/SS-Mastering-windows/SS-Mastering-windows.zip
            artifacts/SS-Mastering-macos/SS-Mastering-macos.zip
